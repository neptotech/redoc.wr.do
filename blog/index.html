<!DOCTYPE html>
<html lang="en" data-theme-mode="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thoughts & Ramblings — redoc</title>
    <meta name="description" content="Writing by Vishnu (redoc) — dev logs, musings, and everything in between.">
    <link rel="stylesheet" href="../style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="particles-js"></div>
    <div class="custom-cursor"></div>

    <nav id="navbar" class="visible">
        <div class="nav-content">
            <div class="nav-left">
                <a href="/" class="nav-brand" style="text-decoration:none">redoc</a>
            </div>
            <ul class="nav-links">
                <li><a href="/#about">About</a></li>
                <li><a href="/#projects">Projects</a></li>
                <li><a href="/#interests">Interests</a></li>
                <li><a href="/blog" class="active-nav-link">Blog</a></li>
            </ul>
        </div>
    </nav>

    <main style="padding-top: 80px;">
        <div class="blog-header">
            <h1><span class="italic">Thoughts</span> &amp; Ramblings</h1>
            <p>Dev logs, musings, and everything in between.</p>
        </div>

        <!-- Skeleton shown while fetching -->
        <div class="blog-grid" id="blog-grid">
            <div class="skeleton-card" id="sk1">
                <div class="skeleton-line short skeleton"></div>
                <div class="skeleton-line tall wide skeleton"></div>
                <div class="skeleton-line full skeleton"></div>
                <div class="skeleton-line med skeleton"></div>
            </div>
            <div class="skeleton-card" id="sk2">
                <div class="skeleton-line short skeleton"></div>
                <div class="skeleton-line tall wide skeleton"></div>
                <div class="skeleton-line full skeleton"></div>
                <div class="skeleton-line med skeleton"></div>
            </div>
            <div class="skeleton-card" id="sk3">
                <div class="skeleton-line short skeleton"></div>
                <div class="skeleton-line tall wide skeleton"></div>
                <div class="skeleton-line full skeleton"></div>
                <div class="skeleton-line med skeleton"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p class="subtle-text">Copyright &copy; 2026 Vishnu Periyannan</p>
    </footer>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme mode: auto" title="Theme: auto">
        <svg class="theme-icon icon-auto" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8V2z" />
            <path fill="currentColor" d="M12 4v16a8 8 0 0 0 0-16z" opacity="0.35" />
        </svg>
        <svg class="theme-icon icon-light" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 18a6 6 0 1 1 0-12a6 6 0 0 1 0 12zm0-14h0zm0 20h0z" />
            <path fill="currentColor"
                d="M12 1h1v3h-1V1zm0 19h1v3h-1v-3zM4.22 4.22l.7-.7l2.12 2.12l-.7.7L4.22 4.22zm12.62 12.62l.7-.7l2.12 2.12l-.7.7l-2.12-2.12zM1 12h3v1H1v-1zm19 0h3v1h-3v-1zM4.22 19.78l2.12-2.12l.7.7l-2.12 2.12l-.7-.7zM16.96 7.04l2.12-2.12l.7.7l-2.12 2.12l-.7-.7z" />
        </svg>
        <svg class="theme-icon icon-dark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5z" />
        </svg>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="../script.js"></script>
    <script>
        /* ── Fetch & render blog posts ── */
        (async () => {
            const grid = document.getElementById('blog-grid');

            function formatDate(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
            }

            function renderCard(post) {
                const tagsHtml = (post.tags || [])
                    .map(t => `<span class="blog-tag">${t}</span>`)
                    .join('');

                const dateHtml = post.date
                    ? `<span class="blog-date">${formatDate(post.date)}</span>`
                    : '';

                return `
                <a class="blog-card" href="/blog/post.html?slug=${encodeURIComponent(post.slug)}" id="post-${post.id}">
                    <div class="blog-card-meta">
                        ${dateHtml}
                        <div class="blog-tags">${tagsHtml}</div>
                    </div>
                    <h2>${post.title}</h2>
                    <p>${post.excerpt || 'Read more…'}</p>
                    <div class="blog-card-footer">Read post &rarr;</div>
                </a>`;
            }

            function renderSkeletons(n = 3) {
                return Array.from({ length: n }, () => `
                <div class="skeleton-card">
                    <div class="skeleton-line short skeleton"></div>
                    <div class="skeleton-line tall wide skeleton"></div>
                    <div class="skeleton-line full skeleton"></div>
                    <div class="skeleton-line med skeleton"></div>
                </div>`).join('');
            }

            try {
                const res  = await fetch('/api/posts');
                const data = await res.json();

                if (!res.ok) throw new Error(data.error ?? 'Failed to load posts');

                const posts = data.posts ?? [];

                if (posts.length === 0) {
                    grid.innerHTML = `<p class="blog-empty">No posts yet — check back soon ✨</p>`;
                    return;
                }

                grid.innerHTML = posts.map(renderCard).join('');

                // Animate cards in with staggered fade
                const cards = grid.querySelectorAll('.blog-card');
                cards.forEach((card, i) => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = `opacity 0.4s ease ${i * 0.08}s, transform 0.4s ease ${i * 0.08}s`;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0)';
                        });
                    });
                });

            } catch (err) {
                console.error(err);
                grid.innerHTML = `<p class="blog-error">⚠ Couldn't load posts: ${err.message}</p>`;
            }
        })();
    </script>
</body>

</html>
