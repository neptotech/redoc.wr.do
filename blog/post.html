<!DOCTYPE html>
<html lang="en" data-theme-mode="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title & meta description are set dynamically from Notion data -->
    <title>Post — redoc</title>
    <meta name="description" content="A post on redoc's blog.">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="particles-js"></div>
    <div class="custom-cursor"></div>

    <nav id="navbar" class="visible">
        <div class="nav-content">
            <div class="nav-left">
                <a href="/" class="nav-brand" style="text-decoration:none">redoc</a>
            </div>
            <ul class="nav-links">
                <li><a href="/#about">About</a></li>
                <li><a href="/#projects">Projects</a></li>
                <li><a href="/#interests">Interests</a></li>
                <li><a href="/blog" class="active-nav-link">Blog</a></li>
            </ul>
        </div>
    </nav>

    <main id="post-main" style="padding-top: 80px;">
        <!-- Skeleton while fetching -->
        <a href="/blog" class="post-back" id="post-back">&#8592; All posts</a>

        <div id="post-skeleton">
            <div style="margin-bottom:2.5rem;">
                <div class="skeleton-line wide tall skeleton" style="margin-bottom:1rem;height:40px;width:65%"></div>
                <div class="skeleton-line med skeleton" style="height:16px"></div>
            </div>
            <div class="skeleton-card" style="height:350px;border-radius:20px;">
                <div class="skeleton-line full skeleton"></div>
                <div class="skeleton-line full skeleton"></div>
                <div class="skeleton-line wide skeleton"></div>
                <div style="height:1.5rem"></div>
                <div class="skeleton-line full skeleton"></div>
                <div class="skeleton-line full skeleton"></div>
                <div class="skeleton-line med skeleton"></div>
            </div>
        </div>

        <!-- Actual post content (hidden until loaded) -->
        <article id="post-article" style="display:none">
            <!-- Ad slot top -->
            <div id="ad-slot-top" class="ad-container">ad</div>

            <div class="post-header">
                <h1 id="post-title"></h1>
                <div class="post-header-meta" id="post-meta"></div>
            </div>

            <div class="post-body" id="post-body"></div>

            <!-- Ad slot bottom -->
            <div id="ad-slot-bottom" class="ad-container">ad</div>
        </article>

        <div id="post-error" style="display:none" class="blog-error">
            <p>⚠ <span id="post-error-msg"></span></p>
            <a href="/blog" class="blog-all-link" style="margin-top:1.5rem">← Back to all posts</a>
        </div>
    </main>

    <footer class="site-footer">
        <p class="subtle-text">Copyright &copy; 2026 Vishnu Periyannan</p>
    </footer>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme mode: auto" title="Theme: auto">
        <svg class="theme-icon icon-auto" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 2a10 10 0 1 0 10 10h-2a8 8 0 1 1-8-8V2z" />
            <path fill="currentColor" d="M12 4v16a8 8 0 0 0 0-16z" opacity="0.35" />
        </svg>
        <svg class="theme-icon icon-light" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 18a6 6 0 1 1 0-12a6 6 0 0 1 0 12zm0-14h0zm0 20h0z" />
            <path fill="currentColor"
                d="M12 1h1v3h-1V1zm0 19h1v3h-1v-3zM4.22 4.22l.7-.7l2.12 2.12l-.7.7L4.22 4.22zm12.62 12.62l.7-.7l2.12 2.12l-.7.7l-2.12-2.12zM1 12h3v1H1v-1zm19 0h3v1h-3v-1zM4.22 19.78l2.12-2.12l.7.7l-2.12 2.12l-.7-.7zM16.96 7.04l2.12-2.12l.7.7l-2.12 2.12l-.7-.7z" />
        </svg>
        <svg class="theme-icon icon-dark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5z" />
        </svg>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="../script.js"></script>
    <script>
        /* ── Fetch & render single post ── */
        (async () => {
            const params  = new URLSearchParams(location.search);
            const slug    = params.get('slug')?.trim();

            const skeleton = document.getElementById('post-skeleton');
            const article  = document.getElementById('post-article');
            const errDiv   = document.getElementById('post-error');
            const errMsg   = document.getElementById('post-error-msg');

            function showError(msg) {
                skeleton.style.display = 'none';
                article.style.display  = 'none';
                errDiv.style.display   = 'block';
                errMsg.textContent     = msg;
            }

            if (!slug) {
                showError('No post slug provided. Go back and pick a post.');
                return;
            }

            function formatDate(iso) {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
            }

            try {
                const res  = await fetch(`/api/post?slug=${encodeURIComponent(slug)}`);
                const data = await res.json();

                if (!res.ok) throw new Error(data.error ?? 'Failed to load post');

                // Update <title> and meta description dynamically
                document.title = `${data.title} — redoc`;
                const metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc) metaDesc.setAttribute('content', data.excerpt || data.title);

                // Populate post header
                document.getElementById('post-title').textContent = data.title;

                const metaEl = document.getElementById('post-meta');
                const tagsHtml = (data.tags || [])
                    .map(t => `<span class="blog-tag">${t}</span>`)
                    .join('');
                metaEl.innerHTML = `
                    ${data.date ? `<span class="blog-date">${formatDate(data.date)}</span>` : ''}
                    <div class="blog-tags">${tagsHtml}</div>`;

                // Inject post body HTML (server-side sanitised Notion blocks)
                document.getElementById('post-body').innerHTML = data.content_html || '<p><em>This post has no content yet.</em></p>';

                // Trigger code syntax highlighting
                if (window.hljs) {
                    hljs.highlightAll();
                }

                // Swap skeleton → article with a fade
                skeleton.style.transition = 'opacity 0.3s ease';
                skeleton.style.opacity    = '0';
                setTimeout(() => {
                    skeleton.style.display = 'none';
                    article.style.display  = 'block';
                    article.style.opacity  = '0';
                    article.style.transition = 'opacity 0.4s ease';
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => { article.style.opacity = '1'; });
                    });
                }, 300);

            } catch (err) {
                console.error(err);
                showError(err.message);
            }
        })();
    </script>
</body>

</html>
